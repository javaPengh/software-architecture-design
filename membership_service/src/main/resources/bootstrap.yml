spring:
  application:
    name: membership-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        namespace: 7dfb20ec-64c1-4e8a-801d-9dc1fa067248
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        file-extension: yaml
        group: DEFAULT_GROUP
        namespace: 7dfb20ec-64c1-4e8a-801d-9dc1fa067248
        # 禁用配置导入检查
        import-check:
          enabled: false
    # Sentinel 配置
    sentinel:
      transport:
        dashboard: localhost:7070  # Sentinel 控制台地址
      eager: true  # 立即加载 Sentinel 控制台
      filter:
        enabled: false  # 关闭 Sentinel 的 Web 拦截
      web-context-unify: false
