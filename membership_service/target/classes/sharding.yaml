databaseName: logic_db

dataSources:
  ds_0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3306/onlinebooking_system
    username: root
    password: '123456'
  ds_1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3306/onlinebooking_system
    username: root
    password: '123456'

rules:
  - !READWRITE_SPLITTING
    dataSourceGroups:
      rw_ds:
        staticStrategy:
          writeDataSourceName: ds_0
          readDataSourceNames:
            - ds_1
        loadBalancerName: round_robin
    loadBalancers:
      round_robin:
        type: ROUND_ROBIN

props:
  sql-show: true

