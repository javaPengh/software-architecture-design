# Nacos开关配置
nacos:
  enabled: true  # 设置为true启用Nacos，false禁用Nacos

spring:
  application:
    name: membership-service
  profiles:
    active: dev
  config:
    import: optional:nacos:datasource.yml
  cloud:
    nacos:
      enabled: ${nacos.enabled:false}  # 使用开关控制
      discovery:
        enabled: ${nacos.enabled:false}
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        namespace: 8db855e6-fa7d-4338-aa94-23e582d754c1
      config:
        enabled: ${nacos.enabled:false}
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        file-extension: yaml
        group: DEFAULT_GROUP
        namespace: 8db855e6-fa7d-4338-aa94-23e582d754c1
        import-check:
          enabled: false
    # Sentinel 配置
    sentinel:
      transport:
        dashboard: localhost:8858  # Sentinel 控制台地址
      eager: true  # 立即加载 Sentinel 控制台
    loadbalancer:
      enabled: true