server {
    listen 80;
    server_name localhost;

    # 1. 前端路由 (处理静态文件和Vue/React路由)
    # 任何不匹配 /api 的请求都会在这里处理。
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # 核心：支持前端路由（如 /home 或 /profile），防止刷新出现 404
        try_files $uri $uri/ /index.html;
    }

    # 会员服务
    location /api/membership/ {
        proxy_pass http://host.docker.internal:8081/membership/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 用户服务
    location /api/search/ {
        proxy_pass http://host.docker.internal:8080/search/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # 用户服务
    location /api/user/ {
        proxy_pass http://host.docker.internal:8080/user/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 电影服务
    location /api/movie/ {
        proxy_pass http://host.docker.internal:8080/movie/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 影厅服务
    location /api/hall/ {
        proxy_pass http://host.docker.internal:8080/hall/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 排片服务
    location /api/screening/ {
        proxy_pass http://host.docker.internal:8080/screening/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 票务服务
    location /api/ticket/ {
        proxy_pass http://host.docker.internal:8080/ticket/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 支付服务
    location /api/alipay/ {
        proxy_pass http://host.docker.internal:8080/alipay/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 可选：处理错误日志
    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log combined;
}
