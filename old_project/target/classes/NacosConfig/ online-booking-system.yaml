# server配置
server:
  port: 8080
  servlet:
    context-path: /
# 连接池配置
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      url: jdbc:mysql://localhost:3306/test
      username: root # 改成你自己的账户名
      password: '123456' # 改成你自己的密码
      driver-class-name: com.mysql.cj.jdbc.Driver # mysql对应驱动

# mybatis-plus的配置
mybatis-plus:
  type-aliases-package: org.zzu.pojo
  global-config:
    db-config:
      logic-delete-field: isDeleted  #全局逻辑删除
      id-type: auto #主键策略自增长
#jwt配置
jwt:
  token:
    tokenExpiration: 1440 #有效时间,单位分钟
    tokenSignKey: onlineSystem  #当前程序签名秘钥 自定义
#支付宝沙箱配置
alipay:
  appId: 9021000140641075
  appPrivateKey: 
  alipayPublicKey: 
  # 支付成功回调地址（http://f82f57ab.natappfree.cc地址是localhost:8080映射到公网上的地址，启动时要修改为当前你自己选用的地址,注意映射的端口号一定要为8080，否则notify不执行）
  notifyUrl:  http://f82f57ab.natappfree.cc/alipay/notify
  #回调页面地址（支付完成后，会跳转回此页面）
  returnUrl: http://localhost:5173/my-orders

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
